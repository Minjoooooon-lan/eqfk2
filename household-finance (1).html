function idNext(a){return Math.max(0,...a.map(x=>+x.id||0))+1}
function saveItem(form){let b=Object.fromEntries(new FormData(form)),k=state.modal,e=state.editing;if(k==="transaction"){b.amount=+b.amount;b.accountId=+b.accountId;b.toAccountId=b.type==="transfer"?+b.toAccountId||null:null;b.categoryId=b.type==="transfer"?null:+b.categoryId||null;b.tags=String(b.tags||"").split(",").map(x=>x.trim()).filter(Boolean);if(b.type==="transfer"&&(!b.toAccountId||b.toAccountId===b.accountId)){notify("Choose two different accounts.",true);return}if(e)Object.assign(e,b);else state.data.transactions.push({id:idNext(state.data.transactions),...b})}if(k==="account"){b.opening=+b.opening||0;if(e)Object.assign(e,b);else state.data.accounts.push({id:idNext(state.data.accounts),...b})}if(k==="budget"){b.limit=+b.limit;b.categoryId=+b.categoryId;if(e)Object.assign(e,b);else{let old=state.data.budgets.find(x=>x.month===b.month&&x.categoryId===b.categoryId);if(old)Object.assign(old,b);else state.data.budgets.push({id:idNext(state.data.budgets),...b})}}if(k==="goal"){b.target=+b.target;b.saved=+b.saved||0;b.accountId=+b.accountId||null;if(e)Object.assign(e,b);else state.data.goals.push({id:idNext(state.data.goals),...b})}if(k==="category")state.data.categories.push({id:idNext(state.data.categories),...b,custom:true,color:b.color||"#5477db"});persist();state.modal=null;state.editing=null;render();notify(t("savedMsg"))}

document.addEventListener("click",e=>{let p=e.target.closest("[data-page]");if(p){state.page=p.dataset.page;state.modal=null;render();return}let n=e.target.closest("[data-new]");if(n){state.modal=n.dataset.new;state.editing=n.dataset.account?{accountId:+n.dataset.account}:null;if(n.dataset.account){state.modal="transaction";state.editing={type:"expense",accountId:+n.dataset.account,date:today()}}render();return}let ed=e.target.closest("[data-edit]");if(ed){let col={transaction:"transactions",account:"accounts",budget:"budgets",goal:"goals"}[ed.dataset.edit];state.modal=ed.dataset.edit;state.editing=state.data[col].find(x=>String(x.id)===ed.dataset.id);render();return}let del=e.target.closest("[data-delete]");if(del){remove(del.dataset.delete,del.dataset.id);return}let a=e.target.closest("[data-act]");if(!a)return;switch(a.dataset.act){case"close":state.modal=null;state.editing=null;render();break;case"prev":{let [y,m]=state.month.split("-").map(Number),d=new Date(y,m-2,1);state.month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render();break}case"next":{let [y,m]=state.month.split("-").map(Number),d=new Date(y,m,1);state.month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render();break}case"backup":download("household-backup-"+today()+".json",JSON.stringify({app:"가계부 Household",exportedAt:new Date().toISOString(),data:state.data},null,2),"application/json");break;case"csv":{let rows=[["date","type","amount","category","account","description","notes","tags"],...state.data.transactions.map(x=>[x.date,x.type,x.amount,cn(cat(x.categoryId)),acc(x.accountId)?.name||"",x.description||"",x.notes||"",(x.tags||[]).join("|")])],csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");download("household-transactions-"+today()+".csv","\ufeff"+csv,"text/csv;charset=utf-8");break}}});
