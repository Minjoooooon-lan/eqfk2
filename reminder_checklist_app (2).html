<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder Checklist & Task Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="bg-[#090d16] text-slate-100 h-full flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <header class="bg-[#0c1222] border-b border-slate-800/80 shadow-lg shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-500/10 border border-indigo-500/20 p-2.5 rounded-xl shadow-inner backdrop-blur-sm">
                    <i class="fa-solid fa-list-check text-2xl text-indigo-400"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-100 flex items-center gap-2">
                        SmartRemind <span class="text-xs uppercase tracking-wider bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full font-semibold border border-indigo-500/30">Pro</span>
                    </h1>
                    <p class="text-xs text-slate-400">Your intelligent checklist & due-date tracker</p>
                </div>
            </div>
            
            <!-- Live Clock Widget with Seconds -->
            <div class="bg-[#090d16]/90 border border-slate-700/50 px-4 py-2 rounded-xl backdrop-blur-md flex items-center gap-3 shadow-md">
                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <div class="text-right">
                    <div id="live-clock" class="text-lg font-mono font-bold tracking-wider text-indigo-200">00:00:00 AM</div>
                    <div id="live-date" class="text-[11px] text-slate-400 font-medium">Loading date...</div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-hidden">

        <!-- Left Column: Notifications & Add Task Form -->
        <div class="lg:col-span-1 flex flex-col gap-6 overflow-y-auto pr-1">
            
            <!-- Notification Center Widget -->
            <div class="bg-[#0c1222] rounded-2xl shadow-xl border border-slate-800/80 p-5 flex flex-col shrink-0">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-bell text-amber-400"></i>
                        <h2 class="font-semibold text-slate-200 text-sm">Notification Center</h2>
                    </div>
                    <span id="notif-badge" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-semibold px-2 py-0.5 rounded-full">0 alerts</span>
                </div>
                <div id="notification-list" class="space-y-2 max-h-40 overflow-y-auto text-xs pr-1">
                    <div class="text-slate-500 text-center py-4 italic">No urgent tasks or warnings right now.</div>
                </div>
            </div>

            <!-- Add Task Form -->
            <div class="bg-[#0c1222] rounded-2xl shadow-xl border border-slate-800/80 p-5 flex-1 flex flex-col">
                <h2 class="font-semibold text-slate-200 text-base mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-indigo-400"></i> New Reminder
                </h2>
                <form id="reminder-form" class="space-y-4 flex-1 flex flex-col justify-between">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Task Note / Title</label>
                            <input type="text" id="task-title" required placeholder="What needs to be done?" 
                                class="w-full text-sm rounded-xl bg-[#090d16] border border-slate-700/80 text-slate-100 placeholder-slate-500 px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Reference Link (Optional)</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                                    <i class="fa-solid fa-link text-xs"></i>
                                </span>
                                <input type="url" id="task-link" placeholder="https://example.com" 
                                    class="w-full text-sm rounded-xl bg-[#090d16] border border-slate-700/80 text-slate-100 placeholder-slate-500 pl-9 pr-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                            </div>
                        </div>

                        <!-- Interactive Due Options Selector -->
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Due Date & Time Option</label>
                            <div class="grid grid-cols-3 gap-2" id="due-option-buttons">
                                <button type="button" data-value="today" 
                                    class="due-btn py-2 px-3 text-xs font-medium rounded-xl border border-indigo-500 bg-indigo-500/15 text-indigo-300 transition-all flex flex-col items-center justify-center gap-1">
                                    <i class="fa-regular fa-sun text-sm"></i> Today
                                </button>
                                <button type="button" data-value="tomorrow" 
                                    class="due-btn py-2 px-3 text-xs font-medium rounded-xl border border-slate-700/80 bg-[#090d16] text-slate-300 hover:border-slate-600 transition-all flex flex-col items-center justify-center gap-1">
                                    <i class="fa-solid fa-moon text-sm"></i> Tomorrow
                                </button>
                                <button type="button" data-value="custom" 
                                    class="due-btn py-2 px-3 text-xs font-medium rounded-xl border border-slate-700/80 bg-[#090d16] text-slate-300 hover:border-slate-600 transition-all flex flex-col items-center justify-center gap-1">
                                    <i class="fa-regular fa-calendar-days text-sm"></i> Others / Calendar
                                </button>
                            </div>
                            <input type="hidden" id="selected-due-option" value="today">
                        </div>

                        <!-- Custom Date Picker (Hidden by default unless 'Others' is selected) -->
                        <div id="custom-date-container" class="hidden transition-all duration-300 pt-1">
                            <label class="block text-xs font-medium text-slate-400 mb-1">Select Custom Date & Time</label>
                            <div class="relative">
                                <input type="datetime-local" id="custom-datetime" 
                                    class="w-full text-sm rounded-xl bg-[#090d16] border border-slate-700/80 text-slate-100 px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                            </div>
                        </div>
                    </div>

                    <button type="submit" 
                        class="w-full mt-4 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 active:from-indigo-800 active:to-indigo-800 text-white font-medium text-sm py-3 px-4 rounded-xl shadow-lg shadow-indigo-950/50 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Publish Reminder
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-2 bg-[#0c1222] rounded-2xl shadow-xl border border-slate-800/80 flex flex-col overflow-hidden">
            <!-- Tabs Header -->
            <div class="flex border-b border-slate-800/80 bg-[#090d16]/60 px-6 pt-4 gap-6 shrink-0">
                <button onclick="switchTab('active')" id="tab-active-btn" 
                    class="pb-3 text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-list-check"></i> Active Reminders <span id="active-count" class="bg-indigo-500/20 text-indigo-300 text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
                <button onclick="switchTab('history')" id="tab-history-btn" 
                    class="pb-3 text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-clock-rotate-left"></i> History Log <span id="history-count" class="bg-slate-800 text-slate-300 text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>

            <!-- Tab Content: Active Checklist -->
            <div id="tab-active" class="flex-1 p-6 overflow-y-auto space-y-3">
                <div id="active-list" class="space-y-3">
                    <!-- Dynamic active tasks loaded here -->
                </div>
            </div>

            <!-- Tab Content: History Log -->
            <div id="tab-history" class="flex-1 p-6 overflow-y-auto space-y-3 hidden">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-slate-400 font-medium">Record of completed or past items</span>
                    <button onclick="clearHistory()" class="text-xs text-rose-400 hover:text-rose-300 font-medium flex items-center gap-1 px-2.5 py-1 rounded-lg bg-rose-500/10 border border-rose-500/20 transition-all">
                        <i class="fa-solid fa-trash-can"></i> Clear History
                    </button>
                </div>
                <div id="history-list" class="space-y-3">
                    <!-- Dynamic history items loaded here -->
                </div>
            </div>
        </div>

    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // State management
        let reminders = JSON.parse(localStorage.getItem('smart_reminders_dark_v2') || '[]');
        let historyLog = JSON.parse(localStorage.getItem('smart_history_dark_v2') || '[]');
        let currentTab = 'active';

        // DOM Elements
        const liveClockEl = document.getElementById('live-clock');
        const liveDateEl = document.getElementById('live-date');
        const dueOptionButtons = document.querySelectorAll('.due-btn');
        const selectedDueOptionInput = document.getElementById('selected-due-option');
        const customDateContainer = document.getElementById('custom-date-container');
        const customDatetimeInput = document.getElementById('custom-datetime');
        const reminderForm = document.getElementById('reminder-form');
        const activeListEl = document.getElementById('active-list');
        const historyListEl = document.getElementById('history-list');
        const activeCountEl = document.getElementById('active-count');
        const historyCountEl = document.getElementById('history-count');
        const notificationListEl = document.getElementById('notification-list');
        const notifBadgeEl = document.getElementById('notif-badge');
        const toastContainer = document.getElementById('toast-container');

        // Update live clock every second
        function updateClock() {
            const now = new Date();
            liveClockEl.textContent = now.toLocaleTimeString();
            liveDateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
            
            // Check deadlines live
            checkDeadlines();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Due option selector buttons interaction
        dueOptionButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                dueOptionButtons.forEach(b => {
                    b.className = "due-btn py-2 px-3 text-xs font-medium rounded-xl border border-slate-700/80 bg-[#090d16] text-slate-300 hover:border-slate-600 transition-all flex flex-col items-center justify-center gap-1";
                });
                btn.className = "due-btn py-2 px-3 text-xs font-medium rounded-xl border border-indigo-500 bg-indigo-500/15 text-indigo-300 transition-all flex flex-col items-center justify-center gap-1";
                
                const val = btn.getAttribute('data-value');
                selectedDueOptionInput.value = val;

                if (val === 'custom') {
                    customDateContainer.classList.remove('hidden');
                    customDatetimeInput.required = true;
                    // Set default value to now + 1 hour if empty
                    if (!customDatetimeInput.value) {
                        const future = new Date(Date.now() + 3600000);
                        customDatetimeInput.value = future.toISOString().slice(0, 16);
                    }
                } else {
                    customDateContainer.classList.add('hidden');
                    customDatetimeInput.required = false;
                }
            });
        });

        // Tab switching function
        function switchTab(tab) {
            currentTab = tab;
            const activeBtn = document.getElementById('tab-active-btn');
            const historyBtn = document.getElementById('tab-history-btn');
            const activeTabContent = document.getElementById('tab-active');
            const historyTabContent = document.getElementById('tab-history');

            if (tab === 'active') {
                activeBtn.className = "pb-3 text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 flex items-center gap-2 transition-all";
                activeBtn.querySelector('span').className = "bg-indigo-500/20 text-indigo-300 text-xs px-2 py-0.5 rounded-full";
                historyBtn.className = "pb-3 text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2 transition-all";
                historyBtn.querySelector('span').className = "bg-slate-800 text-slate-300 text-xs px-2 py-0.5 rounded-full";
                
                activeTabContent.classList.remove('hidden');
                historyTabContent.classList.add('hidden');
            } else {
                historyBtn.className = "pb-3 text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 flex items-center gap-2 transition-all";
                historyBtn.querySelector('span').className = "bg-indigo-500/20 text-indigo-300 text-xs px-2 py-0.5 rounded-full";
                activeBtn.className = "pb-3 text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2 transition-all";
                activeBtn.querySelector('span').className = "bg-slate-800 text-slate-300 text-xs px-2 py-0.5 rounded-full";
                
                historyTabContent.classList.remove('hidden');
                activeTabContent.classList.add('hidden');
            }
        }

        // Form submission handler
        reminderForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('task-title').value.trim();
            const linkInput = document.getElementById('task-link').value.trim();
            const dueOption = selectedDueOptionInput.value;
            let dueDate;

            const now = new Date();
            if (dueOption === 'today') {
                // End of today (23:59:59)
                dueDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).getTime();
            } else if (dueOption === 'tomorrow') {
                const tomorrow = new Date(now);
                tomorrow.setDate(now.getDate() + 1);
                dueDate = new Date(tomorrow.getFullYear(), tomorrow.getMonth(), tomorrow.getDate(), 23, 59, 59).getTime();
            } else {
                const customVal = customDatetimeInput.value;
                if (!customVal) {
                    showToast('Please select a valid custom date and time.', 'error');
                    return;
                }
                dueDate = new Date(customVal).getTime();
            }

            if (dueDate <= now.getTime()) {
                showToast('Due time must be set in the future!', 'error');
                return;
            }

            const newReminder = {
                id: 'task_' + Date.now(),
                title,
                link: linkInput ? (linkInput.startsWith('http') ? linkInput : 'https://' + linkInput) : '',
                dueDate,
                createdAt: now.getTime(),
                notifiedAlmostDue: false
            };

            reminders.push(newReminder);
            saveAndRender();
            reminderForm.reset();
            
            // Reset due option to today
            document.querySelector('.due-btn[data-value="today"]').click();
            showToast('Reminder published successfully!', 'success');
        });

        function completeTask(id) {
            const index = reminders.findIndex(r => r.id === id);
            if (index !== -1) {
                const completedTask = reminders.splice(index, 1)[0];
                completedTask.completedAt = Date.now();
                historyLog.unshift(completedTask);
                saveAndRender();
                showToast('Task completed & moved to history!', 'success');
            }
        }

        function deleteTask(id, fromHistory = false) {
            if (fromHistory) {
                historyLog = historyLog.filter(h => h.id !== id);
            } else {
                reminders = reminders.filter(r => r.id !== id);
            }
            saveAndRender();
            showToast('Item deleted.', 'info');
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all history records?')) {
                historyLog = [];
                saveAndRender();
                showToast('History log cleared.', 'info');
            }
        }

        // Deadline checker and Notification center logic
        function checkDeadlines() {
            const now = Date.now();
            let notifications = [];
            let updated = false;

            reminders.forEach(task => {
                const timeLeft = task.dueDate - now;
                const minutesLeft = timeLeft / (1000 * 60);

                if (timeLeft <= 0) {
                    notifications.push({
                        id: task.id,
                        text: `Overdue: "${task.title}"`
                    });
                } else if (minutesLeft <= 30 && !task.notifiedAlmostDue) {
                    task.notifiedAlmostDue = true;
                    updated = true;
                    showToast(`⚠️ Task almost finished/due: "${task.title}"`, 'warning');
                }

                if (timeLeft > 0 && minutesLeft <= 30) {
                    notifications.push({
                        id: task.id,
                        text: `Due soon (&lt; 30m): "${task.title}"`
                    });
                }
            });

            if (updated) {
                saveToStorage();
            }

            renderNotifications(notifications);
            updateActiveCountdowns();
        }

        function renderNotifications(notifications) {
            notifBadgeEl.textContent = `${notifications.length} alerts`;
            if (notifications.length === 0) {
                notificationListEl.innerHTML = `<div class="text-slate-500 text-center py-4 italic">No urgent tasks or warnings right now.</div>`;
                return;
            }

            notificationListEl.innerHTML = notifications.map(n => `
                <div class="flex items-center justify-between p-2 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-300">
                    <span class="truncate pr-2 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1.5 text-amber-400"></i> ${n.text}</span>
                </div>
            `).join('');
        }

        function updateActiveCountdowns() {
            const now = Date.now();
            reminders.forEach(task => {
                const el = document.getElementById(`countdown_${task.id}`);
                if (el) {
                    el.innerHTML = formatTimeLeft(task.dueDate - now);
                }
            });
        }

        function formatTimeLeft(ms) {
            if (ms <= 0) return '<span class="text-rose-400 font-semibold">Overdue!</span>';
            const totalSecs = Math.floor(ms / 1000);
            const days = Math.floor(totalSecs / (3600 * 24));
            const hours = Math.floor((totalSecs % (3600 * 24)) / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;

            if (days > 0) return `Due in ${days}d ${hours}h ${mins}m`;
            return `Due in ${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        }

        function saveAndRender() {
            saveToStorage();
            renderLists();
        }

        function saveToStorage() {
            localStorage.setItem('smart_reminders_dark_v2', JSON.stringify(reminders));
            localStorage.setItem('smart_history_dark_v2', JSON.stringify(historyLog));
        }

        function renderLists() {
            activeCountEl.textContent = reminders.length;
            historyCountEl.textContent = historyLog.length;

            // Render Active List
            if (reminders.length === 0) {
                activeListEl.innerHTML = `
                    <div class="text-center py-16 border-2 border-dashed border-slate-800/80 rounded-2xl">
                        <i class="fa-regular fa-clipboard text-slate-600 text-4xl mb-3"></i>
                        <p class="text-sm font-medium text-slate-300">No active reminders</p>
                        <p class="text-xs text-slate-500 mt-1">Publish a reminder from the left panel to get started.</p>
                    </div>`;
            } else {
                activeListEl.innerHTML = reminders.map(task => {
                    const now = Date.now();
                    const isOverdue = task.dueDate <= now;
                    return `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-2xl border ${isOverdue ? 'border-rose-500/40 bg-rose-950/20' : 'border-slate-800/80 bg-[#090d16]/50 hover:border-slate-700'} shadow-sm transition-all gap-3">
                            <div class="flex items-start gap-3 flex-1 min-w-0">
                                <button onclick="completeTask('${task.id}')" title="Mark as done" class="mt-0.5 w-5 h-5 rounded-md border-2 border-slate-600 hover:border-indigo-400 hover:bg-indigo-500/20 flex items-center justify-center transition-all shrink-0">
                                </button>
                                <div class="min-w-0 flex-1">
                                    <h3 class="font-semibold text-slate-100 text-sm truncate">${escapeHtml(task.title)}</h3>
                                    ${task.link ? `<a href="${escapeHtml(task.link)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs text-indigo-400 hover:underline mt-1 truncate max-w-full"><i class="fa-solid fa-external-link text-[10px]"></i> ${escapeHtml(task.link)}</a>` : ''}
                                    <div class="flex items-center gap-3 mt-1.5 text-xs text-slate-400 flex-wrap">
                                        <span id="countdown_${task.id}" class="font-mono font-medium text-indigo-400">${formatTimeLeft(task.dueDate - now)}</span>
                                        <span class="text-slate-600">•</span>
                                        <span>Due: ${new Date(task.dueDate).toLocaleString()}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 self-end sm:self-center">
                                <button onclick="completeTask('${task.id}')" class="bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 text-xs font-medium px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5">
                                    <i class="fa-solid fa-check"></i> Done
                                </button>
                                <button onclick="deleteTask('${task.id}')" class="text-slate-500 hover:text-rose-400 p-1.5 rounded-lg transition-all" title="Delete">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Render History List
            if (historyLog.length === 0) {
                historyListEl.innerHTML = `
                    <div class="text-center py-16 border-2 border-dashed border-slate-800/80 rounded-2xl">
                        <i class="fa-regular fa-clock text-slate-600 text-4xl mb-3"></i>
                        <p class="text-sm font-medium text-slate-300">No history records yet</p>
                        <p class="text-xs text-slate-500 mt-1">Completed reminders will be archived here automatically.</p>
                    </div>`;
            } else {
                historyListEl.innerHTML = historyLog.map(item => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-2xl border border-slate-800/80 bg-[#090d16]/30 gap-3">
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2">
                                <span class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-[10px] font-semibold px-2 py-0.5 rounded-full">Completed</span>
                                <h3 class="font-medium text-slate-300 text-sm line-through truncate">${escapeHtml(item.title)}</h3>
                            </div>
                            ${item.link ? `<a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs text-slate-500 hover:underline mt-1 truncate max-w-full"><i class="fa-solid fa-external-link text-[10px]"></i> ${escapeHtml(item.link)}</a>` : ''}
                            <div class="text-xs text-slate-500 mt-1">
                                Completed on: ${new Date(item.completedAt).toLocaleString()}
                            </div>
                        </div>
                        <button onclick="deleteTask('${item.id}', true)" class="text-slate-500 hover:text-rose-400 p-1.5 rounded-lg transition-all self-end sm:self-center" title="Remove from history">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `).join('');
            }
        }

        // Toast feedback helper
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-950 border border-rose-800 text-rose-100' : type === 'warning' ? 'bg-amber-950 border border-amber-800 text-amber-100' : 'bg-slate-900 border border-slate-700 text-slate-100';
            toast.className = `${bgClass} text-xs px-4 py-3 rounded-xl shadow-2xl pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300 flex items-center gap-2`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation text-rose-400' : type === 'warning' ? 'fa-triangle-exclamation text-amber-400' : 'fa-circle-check text-emerald-400'}"></i>
                <span>${message}</span>
            `;
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial render on load
        renderLists();
    </script>
</body>
</html>
